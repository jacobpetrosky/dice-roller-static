<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Client Web Dice Roller</title>
	
    <link rel="stylesheet" href="styles.css">

</head>
<body onload="rollDice()">
	<header>
		<h1>Jacob’s client web dice roller</h1>
		<p>Press Roll to roll all 5 dice!</p>
	</header>
		

	<div class="dice">
            <div class = "die" id="die0">
            </div>
            <div class = "die" id="die1">
            </div>
            <div class = "die" id="die2">
            </div>
            <div class = "die" id="die3" >
            </div>
            <div class = "die" id="die4">
            </div>    
    </div>
	

	<div class = button-containter>
		<button onclick="rollDice()" autofocus>Roll</button>

		<button onclick="corsTest()">Press to force a cors failure</button>
	</div>
	

	<script src="main.js"></script>
</body>
</html>
